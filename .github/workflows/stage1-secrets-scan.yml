# ─────────────────────────────────────────────────────────────────────────────
# Stage 1 — Pre-Commit Secrets Scanning
# Tools: Gitleaks (SARIF) + TruffleHog (verified-secrets) running in PARALLEL
#
# Failure policy:
#   CRITICAL / HIGH  → fail the workflow (blocks merge)
#   MEDIUM / LOW     → uploaded as artifacts, workflow continues (warn-only)
#
# Targets: frontend (Go), checkoutservice (Go), cartservice (C#)
# ─────────────────────────────────────────────────────────────────────────────

name: "Stage 1 · Secrets Scanning"

on:
  push:
    branches: [main]
    paths:
      - "microservices-demo/src/frontend/**"
      - "microservices-demo/src/checkoutservice/**"
      - "microservices-demo/src/cartservice/**"
      - ".gitleaks.toml"
      - ".github/workflows/stage1-secrets-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "microservices-demo/src/frontend/**"
      - "microservices-demo/src/checkoutservice/**"
      - "microservices-demo/src/cartservice/**"
      - ".gitleaks.toml"
      - ".github/workflows/stage1-secrets-scan.yml"

# Allow one concurrent run per PR/branch; cancel outdated runs
concurrency:
  group: "secrets-scan-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read          # checkout
  security-events: write  # upload SARIF to Security tab
  pull-requests: write    # post PR summary comment
  actions: read           # download artifacts in report job

env:
  # Services in scope — used by both jobs and the report aggregator
  PILOT_SERVICES: "frontend checkoutservice cartservice"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Gitleaks (SARIF output → GitHub Security tab)
  # ───────────────────────────────────────────────────────────────────────────
  gitleaks-scan:
    name: "Gitleaks · Secrets Scan"
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.set-outcome.outputs.outcome }}
      findings-count: ${{ steps.parse-sarif.outputs.findings_count }}
      high-count: ${{ steps.parse-sarif.outputs.high_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history required for gitleaks git-log scan mode
          fetch-depth: 0

      # ── Run Gitleaks ───────────────────────────────────────────────────────
      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # optional: for SARIF on private repos
        with:
          config-path: ".gitleaks.toml"
          # Scan only changed paths on PRs; scan full history on push to main
          args: >-
            detect
            --config .gitleaks.toml
            --source .
            --report-format sarif
            --report-path gitleaks-results.sarif
            --exit-code 0
            --log-level warn
        # exit-code 0 here — we parse severity ourselves below

      # ── Parse SARIF to determine HIGH/CRITICAL count ───────────────────────
      - name: Parse SARIF for severity breakdown
        id: parse-sarif
        if: always()
        run: |
          if [ ! -f "gitleaks-results.sarif" ]; then
            echo "findings_count=0" >> "$GITHUB_OUTPUT"
            echo "high_count=0"     >> "$GITHUB_OUTPUT"
            exit 0
          fi

          total=$(jq '[.runs[].results[]] | length' gitleaks-results.sarif 2>/dev/null || echo "0")
          high=$(jq '[
            .runs[].results[]
            | select(
                .level == "error"
                or (.properties.severity? | ascii_downcase) == "high"
                or (.properties.severity? | ascii_downcase) == "critical"
              )
          ] | length' gitleaks-results.sarif 2>/dev/null || echo "0")

          echo "findings_count=${total}" >> "$GITHUB_OUTPUT"
          echo "high_count=${high}"      >> "$GITHUB_OUTPUT"
          echo "Total findings: ${total}, HIGH/CRITICAL: ${high}"

      # ── Upload SARIF to GitHub Security tab ───────────────────────────────
      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-results.sarif
          category: "gitleaks"

      # ── Save SARIF as artifact for the report job ─────────────────────────
      - name: Archive Gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks-results.sarif
          retention-days: 30
          if-no-files-found: ignore

      # ── Set outcome based on HIGH/CRITICAL count ──────────────────────────
      - name: Set outcome
        id: set-outcome
        if: always()
        run: |
          high=${{ steps.parse-sarif.outputs.high_count || 0 }}
          if [ "$high" -gt 0 ]; then
            echo "outcome=FAIL" >> "$GITHUB_OUTPUT"
            echo "::error::Gitleaks found ${high} HIGH/CRITICAL secret(s). Merge blocked."
            exit 1
          else
            echo "outcome=PASS" >> "$GITHUB_OUTPUT"
            echo "::notice::Gitleaks: no HIGH/CRITICAL secrets found ✅"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — TruffleHog (verified secrets, git history)
  # ───────────────────────────────────────────────────────────────────────────
  trufflehog-scan:
    name: "TruffleHog · Verified Secrets Scan"
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.set-outcome.outputs.outcome }}
      verified-count: ${{ steps.parse-results.outputs.verified_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Run TruffleHog ────────────────────────────────────────────────────
      - name: Run TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          # Scan only the pilot service paths for speed
          path: ./microservices-demo/src
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: HEAD
          extra_args: >-
            --only-verified
            --json
            --no-update
            --exclude-paths .trufflehog-exclude.txt
        # Don't fail here — capture output and decide below
        continue-on-error: true

      # ── Capture JSON output ───────────────────────────────────────────────
      - name: Capture TruffleHog output
        id: capture
        if: always()
        run: |
          # TruffleHog outputs JSON to stdout; redirect to file
          # The action itself doesn't save files, so we re-run via CLI for capture
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///repo \
            --only-verified \
            --json \
            --no-update \
            2>/dev/null > trufflehog-results.json || true

          echo "TruffleHog output lines: $(wc -l < trufflehog-results.json)"

      # ── Parse results ─────────────────────────────────────────────────────
      - name: Parse TruffleHog results
        id: parse-results
        if: always()
        run: |
          if [ ! -s "trufflehog-results.json" ]; then
            echo "verified_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Each line is a JSON object (JSONL format)
          verified=$(grep -c '"Verified":true' trufflehog-results.json 2>/dev/null || echo "0")
          echo "verified_count=${verified}" >> "$GITHUB_OUTPUT"
          echo "Verified secrets found: ${verified}"

          # Print a summary of what was found (strip sensitive values)
          if [ "$verified" -gt 0 ]; then
            echo "::warning::TruffleHog found ${verified} VERIFIED secret(s) in git history"
            jq -r '. | "Detector: \(.DetectorName) | File: \(.SourceMetadata.Data.Git.file) | Line: \(.SourceMetadata.Data.Git.line)"' \
              trufflehog-results.json 2>/dev/null || true
          fi

      # ── Archive results ───────────────────────────────────────────────────
      - name: Archive TruffleHog results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json
          retention-days: 30
          if-no-files-found: ignore

      # ── Set outcome ───────────────────────────────────────────────────────
      - name: Set outcome
        id: set-outcome
        if: always()
        run: |
          verified=${{ steps.parse-results.outputs.verified_count || 0 }}
          if [ "$verified" -gt 0 ]; then
            echo "outcome=FAIL" >> "$GITHUB_OUTPUT"
            echo "::error::TruffleHog found ${verified} verified secret(s). Merge blocked."
            exit 1
          else
            echo "outcome=PASS" >> "$GITHUB_OUTPUT"
            echo "::notice::TruffleHog: no verified secrets found ✅"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Secrets Report Aggregator
  # Runs AFTER both scanners (always), posts PR comment, sets final status
  # ───────────────────────────────────────────────────────────────────────────
  secrets-report:
    name: "Secrets Scan · Summary Report"
    runs-on: ubuntu-latest
    needs: [gitleaks-scan, trufflehog-scan]
    if: always()

    steps:
      - name: Download Gitleaks SARIF
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-sarif
        continue-on-error: true

      - name: Download TruffleHog results
        uses: actions/download-artifact@v4
        with:
          name: trufflehog-results
        continue-on-error: true

      # ── Build GitHub Actions Job Summary ─────────────────────────────────
      - name: Build Job Summary
        id: summary
        if: always()
        env:
          GL_OUTCOME: ${{ needs.gitleaks-scan.outputs.outcome }}
          GL_FINDINGS: ${{ needs.gitleaks-scan.outputs.findings-count }}
          GL_HIGH: ${{ needs.gitleaks-scan.outputs.high-count }}
          TH_OUTCOME: ${{ needs.trufflehog-scan.outputs.outcome }}
          TH_VERIFIED: ${{ needs.trufflehog-scan.outputs.verified-count }}
        run: |
          gl_status="${GL_OUTCOME:-UNKNOWN}"
          th_status="${TH_OUTCOME:-UNKNOWN}"

          gl_emoji="✅"
          th_emoji="✅"
          overall_emoji="✅"
          overall_text="**All clear — no secrets detected**"

          [ "$gl_status" = "FAIL" ] && gl_emoji="🚨" && overall_emoji="🚨"
          [ "$th_status" = "FAIL" ] && th_emoji="🚨" && overall_emoji="🚨"

          if [ "$gl_status" = "FAIL" ] || [ "$th_status" = "FAIL" ]; then
            overall_text="**HIGH/CRITICAL secrets detected — merge BLOCKED**"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # ${overall_emoji} Stage 1 · Secrets Scanning Report

          > Commit: \`${{ github.sha }}\` | Branch: \`${{ github.ref_name }}\`
          > Services scanned: \`frontend\` · \`checkoutservice\` · \`cartservice\`

          ## ${overall_text}

          | Scanner | Status | Findings | Notes |
          |---------|--------|----------|-------|
          | ${gl_emoji} Gitleaks | \`${gl_status}\` | Total: ${GL_FINDINGS:-0} · HIGH: ${GL_HIGH:-0} | SARIF uploaded to Security tab |
          | ${th_emoji} TruffleHog | \`${th_status}\` | Verified: ${TH_VERIFIED:-0} | Git history scan |

          ### Severity Policy
          | Severity | Action |
          |----------|--------|
          | 🔴 CRITICAL / HIGH | **Block merge** |
          | 🟡 MEDIUM | Warn, allow merge |
          | 🟢 LOW | Info only |

          ---
          > 📁 Full scan artifacts available in the **Actions → Artifacts** section.
          > 🔒 SARIF results visible in **Security → Code scanning alerts**.
          EOF

          # Emit overall result as output
          if [ "$gl_status" = "FAIL" ] || [ "$th_status" = "FAIL" ]; then
            echo "overall=FAIL" >> "$GITHUB_OUTPUT"
          else
            echo "overall=PASS" >> "$GITHUB_OUTPUT"
          fi

      # ── Post PR comment ───────────────────────────────────────────────────
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          GL_OUTCOME: ${{ needs.gitleaks-scan.outputs.outcome }}
          GL_FINDINGS: ${{ needs.gitleaks-scan.outputs.findings-count }}
          GL_HIGH: ${{ needs.gitleaks-scan.outputs.high-count }}
          TH_OUTCOME: ${{ needs.trufflehog-scan.outputs.outcome }}
          TH_VERIFIED: ${{ needs.trufflehog-scan.outputs.verified-count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const glOutcome  = process.env.GL_OUTCOME  || 'UNKNOWN';
            const thOutcome  = process.env.TH_OUTCOME  || 'UNKNOWN';
            const glFindings = process.env.GL_FINDINGS || '0';
            const glHigh     = process.env.GL_HIGH     || '0';
            const thVerified = process.env.TH_VERIFIED || '0';

            const failed = glOutcome === 'FAIL' || thOutcome === 'FAIL';
            const overallEmoji  = failed ? '🚨' : '✅';
            const overallStatus = failed
              ? '**HIGH/CRITICAL secrets detected — merge BLOCKED**'
              : '**No secrets detected — merge allowed**';

            const glEmoji = glOutcome === 'FAIL' ? '🚨' : '✅';
            const thEmoji = thOutcome === 'FAIL' ? '🚨' : '✅';

            const body = `
            ## ${overallEmoji} Stage 1 · Secrets Scanning

            ${overallStatus}

            | Scanner | Status | Findings |
            |---------|--------|----------|
            | ${glEmoji} Gitleaks | \`${glOutcome}\` | Total: ${glFindings} · HIGH: ${glHigh} |
            | ${thEmoji} TruffleHog | \`${thOutcome}\` | Verified: ${thVerified} |

            > 🔒 [View SARIF in Security tab](https://github.com/${{ github.repository }}/security/code-scanning)
            > 📁 [Download full artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            <sub>🤖 Posted by Stage 1 Secrets Scanner · commit \`${{ github.sha }}\`</sub>
            `;

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Stage 1 · Secrets Scanning')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # ── Final gate: fail this job if either scanner failed ────────────────
      - name: Enforce merge gate
        if: always()
        run: |
          overall="${{ steps.summary.outputs.overall }}"
          if [ "$overall" = "FAIL" ]; then
            echo "::error::Secrets scan gate FAILED. See Security tab for details."
            exit 1
          fi
          echo "::notice::Secrets scan gate PASSED ✅"
