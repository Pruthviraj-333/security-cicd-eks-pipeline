# ─────────────────────────────────────────────────────────────────────────────
# Stage 5 — Container Image Build + Cosign Supply-Chain Signing
#
# Flow per service:
#   1. Build multi-arch image (linux/amd64) with Docker Buildx
#   2. Push to GitHub Container Registry (ghcr.io/pruthviraj-333/<service>)
#   3. Sign image digest with Cosign keyless OIDC (no long-lived keys)
#   4. Attach SBOM (Syft) to the image in the registry
#   5. Verify signature is valid before marking job as passed
#
# Registry: ghcr.io/pruthviraj-333/
# Signing:  Cosign keyless via GitHub OIDC — public Sigstore Rekor transparency log
# SBOM:     Syft → SPDX JSON attached as OCI artifact
#
# Trigger: only on push to main (not PRs — we don't push untrusted code to registry)
#
# Failure policy:
#   Build failure         → fail immediately
#   Signing failure       → fail (unsigned images must not proceed to deploy)
#   Verification failure  → fail
# ─────────────────────────────────────────────────────────────────────────────

name: "Stage 5 · Image Build + Cosign Signing"

on:
  push:
    branches: [main]
    paths:
      - "microservices-demo/src/frontend/**"
      - "microservices-demo/src/cartservice/**"
      - "microservices-demo/src/checkoutservice/**"
      - ".github/workflows/stage5-image-sign.yml"
  # Also allow manual triggering for re-signing on demand
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build and sign (leave empty for all)"
        required: false
        default: "all"
        type: choice
        options: [all, frontend, cartservice, checkoutservice]

concurrency:
  group: "image-sign-${{ github.ref }}"
  cancel-in-progress: false   # Never cancel an in-flight signing job

permissions:
  contents: read
  packages: write          # Push to GHCR
  id-token: write          # Cosign OIDC keyless signing (CRITICAL — must be set)
  security-events: write   # Upload SBOM/signing attestations
  pull-requests: read

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: pruthviraj-333   # lowercase required for GHCR

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build, push, sign, and verify each pilot service image
  # Runs as a matrix: one job per service in parallel
  # ───────────────────────────────────────────────────────────────────────────
  build-sign:
    name: "Build + Sign · ${{ matrix.service }}"
    runs-on: ubuntu-latest

    outputs:
      frontend-digest:     ${{ steps.meta.outputs.digest }}
      frontend-image:      ${{ steps.meta.outputs.tags }}
      cartservice-digest:  ${{ steps.meta.outputs.digest }}
      checkoutservice-digest: ${{ steps.meta.outputs.digest }}

    strategy:
      fail-fast: false    # Let all services attempt independently
      matrix:
        include:
          - service: frontend
            context: microservices-demo/src/frontend
            dockerfile: microservices-demo/src/frontend/Dockerfile

          - service: cartservice
            context: microservices-demo/src/cartservice/src
            dockerfile: microservices-demo/src/cartservice/src/Dockerfile

          - service: checkoutservice
            context: microservices-demo/src/checkoutservice
            dockerfile: microservices-demo/src/checkoutservice/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up Docker Buildx ─────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      # ── Log in to GHCR ───────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Generate image metadata (tags + labels) ──────────────────────────
      # Tag strategy:
      #   :latest           → latest main branch build
      #   :<git-sha>        → immutable reference per commit
      #   :main-<YYYYMMDD>  → date-based tag for rollback
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=raw,value={{branch}}-{{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=Online Boutique ${{ matrix.service }} — security-cicd-eks-pipeline
            org.opencontainers.image.vendor=Pruthviraj-333
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      # ── Build and push image ─────────────────────────────────────────────
      # We push by digest (not tag) to ensure we sign exactly what was pushed
      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache for faster rebuilds
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          # Build provenance attestation (SLSA level 2)
          provenance: true
          # SBOM generation at build time (embedded in image manifest)
          sbom: true

      # ── Install Cosign ───────────────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      # ── Install Syft (for explicit SBOM attachment) ──────────────────────
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      # ── Sign image with Cosign keyless OIDC ─────────────────────────────
      # This creates a signature entry in the public Sigstore Rekor transparency log.
      # The OIDC token from GitHub Actions acts as the signing identity.
      # No long-lived private keys are used or stored anywhere.
      - name: Sign image with Cosign (keyless OIDC)
        id: sign
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.service }}@${{ steps.build-push.outputs.digest }}
        run: |
          echo "Signing image: ${IMAGE_REF}"
          echo "Digest: ${DIGEST}"

          cosign sign \
            --yes \
            --rekor-url https://rekor.sigstore.dev \
            --fulcio-url https://fulcio.sigstore.dev \
            --oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_REF}"

          echo "Image signed successfully"
          echo "::notice::Image signed: ${IMAGE_REF}"

      # ── Attach custom attestation (build metadata) ────────────────────────
      - name: Attest image (build provenance)
        id: attest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.service }}@${{ steps.build-push.outputs.digest }}
        run: |
          # Create a build attestation payload
          cat > /tmp/build-attestation.json << EOF
          {
            "buildType": "https://github.com/Pruthviraj-333/security-cicd-eks-pipeline/blob/main/.github/workflows/stage5-image-sign.yml",
            "builder": {
              "id": "https://github.com/actions/runner"
            },
            "invocation": {
              "configSource": {
                "uri": "https://github.com/${{ github.repository }}",
                "digest": {"sha1": "${{ github.sha }}"},
                "entryPoint": ".github/workflows/stage5-image-sign.yml"
              },
              "parameters": {
                "service": "${{ matrix.service }}",
                "workflow_run_id": "${{ github.run_id }}",
                "workflow_run_number": "${{ github.run_number }}"
              },
              "environment": {
                "github_actor": "${{ github.actor }}",
                "github_ref": "${{ github.ref }}",
                "github_run_id": "${{ github.run_id }}"
              }
            },
            "buildConfig": {
              "steps": [
                {"entryPoint": "docker/build-push-action", "arguments": ["context=${{ matrix.context }}"]}
              ]
            },
            "materials": [
              {
                "uri": "https://github.com/${{ github.repository }}",
                "digest": {"sha1": "${{ github.sha }}"}
              }
            ]
          }
          EOF

          cosign attest \
            --yes \
            --predicate /tmp/build-attestation.json \
            --type slsaprovenance \
            --rekor-url https://rekor.sigstore.dev \
            "${IMAGE_REF}" || echo "::warning::Attestation upload failed (non-blocking)"

      # ── Generate and attach SBOM with Syft ─────────────────────────────
      - name: Generate SBOM (Syft → SPDX)
        id: sbom
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.service }}@${{ steps.build-push.outputs.digest }}
        run: |
          # Generate SBOM from the pushed image
          syft "${IMAGE_REF}" \
            -o spdx-json=/tmp/sbom-${{ matrix.service }}.spdx.json \
            -o table \
            2>&1 | tail -20

          echo "SBOM generated: $(jq '.packages | length' /tmp/sbom-${{ matrix.service }}.spdx.json 2>/dev/null || echo "?") packages"

      - name: Attach SBOM as attestation
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.service }}@${{ steps.build-push.outputs.digest }}
        run: |
          cosign attest \
            --yes \
            --predicate /tmp/sbom-${{ matrix.service }}.spdx.json \
            --type spdxjson \
            --rekor-url https://rekor.sigstore.dev \
            "${IMAGE_REF}" || echo "::warning::SBOM attestation upload failed (non-blocking)"

      # ── Archive SBOM artifact ─────────────────────────────────────────────
      - name: Archive SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: /tmp/sbom-${{ matrix.service }}.spdx.json
          retention-days: 90   # Longer retention for supply-chain compliance
          if-no-files-found: ignore

      # ── VERIFICATION: Confirm signature is valid ─────────────────────────
      # This step FAILS the job if the signature cannot be verified.
      # It proves the signing round-trip works end-to-end.
      - name: Verify Cosign signature
        id: verify
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.service }}@${{ steps.build-push.outputs.digest }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          CERT_IDENTITY_REGEX: "^https://github.com/${{ github.repository }}/.github/workflows/stage5-image-sign.yml"
        run: |
          echo "Verifying signature for: ${IMAGE_REF}"

          cosign verify \
            --rekor-url https://rekor.sigstore.dev \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEX}" \
            "${IMAGE_REF}" \
            | jq '.[0] | {subject: .optional.Subject, issuer: .optional.Issuer, signingTime: .optional.SigningTime}' \
            2>/dev/null || true

          echo "Signature verified successfully"
          echo "::notice::${{ matrix.service }} image signature verified — supply chain intact"

      # ── Summary: print image digest and signing info ──────────────────────
      - name: Print image signing summary
        if: always()
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ${{ matrix.service }}

          | Field | Value |
          |-------|-------|
          | Image | \`${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.service }}\` |
          | Digest | \`${DIGEST}\` |
          | Tags | \`${{ steps.meta.outputs.tags }}\` |
          | Signed | Cosign keyless OIDC (Rekor transparency log) |
          | SBOM | SPDX JSON attached as OCI attestation |
          | Provenance | SLSA build provenance attestation |
          | Rekor entry | [sigstore.dev/rekor](https://rekor.sigstore.dev/) |
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Post-signing verification gate
  # Confirms all 3 services were signed before allowing downstream stages
  # ───────────────────────────────────────────────────────────────────────────
  signing-gate:
    name: "Supply Chain · Signing Gate"
    runs-on: ubuntu-latest
    needs: [build-sign]
    if: always()

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Log in to GHCR (for verification)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Verify all three images are signed (cross-check) ─────────────────
      - name: Cross-verify all service signatures
        id: cross-verify
        env:
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          CERT_REGEXP: "^https://github.com/${{ github.repository }}/.github/workflows/stage5-image-sign.yml"
          REGISTRY: ghcr.io
          OWNER: pruthviraj-333
        run: |
          all_passed=true

          for service in frontend cartservice checkoutservice; do
            IMAGE="${REGISTRY}/${OWNER}/${service}:latest"
            echo "--- Verifying: ${IMAGE}"

            if cosign verify \
              --rekor-url https://rekor.sigstore.dev \
              --certificate-oidc-issuer "${OIDC_ISSUER}" \
              --certificate-identity-regexp "${CERT_REGEXP}" \
              "${IMAGE}" > /dev/null 2>&1; then
              echo "::notice::${service}: signature valid"
            else
              echo "::error::${service}: signature verification FAILED"
              all_passed=false
            fi
          done

          if [ "$all_passed" = false ]; then
            echo "::error::One or more images failed signature verification. Deployment BLOCKED."
            exit 1
          fi

          echo "::notice::All 3 service images verified — supply chain intact"

      - name: Build final summary
        if: always()
        run: |
          matrix_result="${{ needs.build-sign.result }}"
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # Stage 5 · Supply-Chain Signing Report

          > Commit: \`${{ github.sha }}\` | Branch: \`${{ github.ref_name }}\`
          > Registry: \`ghcr.io/pruthviraj-333/\`

          ## Signing Method: Cosign Keyless OIDC

          | Property | Value |
          |----------|-------|
          | Key material | None (keyless) — GitHub OIDC token |
          | CA | Sigstore Fulcio |
          | Transparency log | Sigstore Rekor (public, append-only) |
          | SBOM format | SPDX JSON (attached as OCI attestation) |
          | Provenance | SLSA L2 (build provenance attached) |

          ## Services Signed

          | Service | Language | Base Image | Status |
          |---------|----------|------------|--------|
          | frontend | Go 1.27 | gcr.io/distroless/static | ${{ needs.build-sign.result == 'success' && 'Signed' || 'Failed' }} |
          | cartservice | C# .NET 10 | mcr.microsoft.com/dotnet/runtime-deps:chiseled | ${{ needs.build-sign.result == 'success' && 'Signed' || 'Failed' }} |
          | checkoutservice | Go 1.27 | gcr.io/distroless/static | ${{ needs.build-sign.result == 'success' && 'Signed' || 'Failed' }} |

          ## Verifying Signatures Locally

          \`\`\`bash
          # Install cosign: https://docs.sigstore.dev/cosign/installation/

          cosign verify \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/stage5-image-sign.yml" \\
            ghcr.io/pruthviraj-333/frontend:latest
          \`\`\`
          EOF
