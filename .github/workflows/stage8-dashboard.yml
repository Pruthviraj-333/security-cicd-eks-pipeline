# ─────────────────────────────────────────────────────────────────────────────
# Stage 8 — Security Dashboard (Scan Result Aggregation)
#
# This workflow runs AFTER all security scan stages complete on main.
# It aggregates all scan results and ships them to:
#   1. CloudWatch custom metrics  → feeds Grafana dashboards (Stage 8)
#   2. Loki structured logs       → searchable in Grafana
#   3. GitHub Actions Job Summary → always-on, zero-infra summary
#
# CloudWatch metric namespace: SecurityCICD/PipelineMetrics
# Metrics published per run:
#   - SecretsFindings       (Stage 1)
#   - SASTFindings          (Stage 2)
#   - SCAVulnerabilities    (Stage 3)
#   - IaCFindings           (Stage 4)
#   - ImagesSigned          (Stage 5)
#   - DeploymentSuccess     (Stage 6)
#   - DriftDetected         (Stage 7)
#   - PipelinePassRate      (overall)
# ─────────────────────────────────────────────────────────────────────────────

name: "Stage 8 · Security Dashboard"

on:
  # Run after any security stage completes on main
  workflow_run:
    workflows:
      - "Stage 1 · Secrets Scanning"
      - "Stage 2 · SAST"
      - "Stage 3 · SCA (Dependency Scanning)"
      - "Stage 4 · IaC Security Scanning"
      - "Stage 5 · Image Build + Cosign Signing"
      - "Stage 6 · GitOps Deploy (ArgoCD)"
      - "Stage 7 · Drift Detection"
    types: [completed]
    branches: [main]

  # Also run on schedule for a full daily summary
  schedule:
    - cron: "0 6 * * *"     # 06:00 UTC daily (11:30 IST)

  workflow_dispatch:
    inputs:
      days_back:
        description: "Number of days of history to aggregate"
        required: false
        default: "7"
        type: string

concurrency:
  group: "dashboard-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write       # AWS OIDC
  actions: read         # Read other workflow run results
  issues: read          # Read drift issues

env:
  AWS_REGION: ap-south-1
  CW_NAMESPACE: SecurityCICD/PipelineMetrics
  CLUSTER_NAME: security-cicd-dev-security-cicd-eks
  LOKI_URL: "http://localhost:3100"   # Port-forwarded during the job

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Aggregate all scan workflow results and publish to CloudWatch
  # ───────────────────────────────────────────────────────────────────────────
  aggregate-and-publish:
    name: "Aggregate Scan Results → CloudWatch"
    runs-on: ubuntu-latest
    outputs:
      report-path: ${{ steps.aggregate.outputs.report_path }}
      pass-rate: ${{ steps.aggregate.outputs.pass_rate }}
      total-findings: ${{ steps.aggregate.outputs.total_findings }}

    steps:
      # ── AWS auth ─────────────────────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/security-cicd-dev-github-actions-deploy
          role-session-name: dashboard-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true   # Graceful if cluster not yet provisioned

      # ── Download artifacts from all recent stage runs ─────────────────────
      - name: Fetch recent workflow run results via GitHub API
        id: fetch-runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const days = parseInt('${{ github.event.inputs.days_back || 7 }}');
            const since = new Date(Date.now() - days * 86400000).toISOString();

            const stageWorkflows = [
              'Stage 1 · Secrets Scanning',
              'Stage 2 · SAST',
              'Stage 3 · SCA (Dependency Scanning)',
              'Stage 4 · IaC Security Scanning',
              'Stage 5 · Image Build + Cosign Signing',
              'Stage 6 · GitOps Deploy (ArgoCD)',
              'Stage 7 · Drift Detection',
            ];

            const summary = {};

            for (const wfName of stageWorkflows) {
              try {
                // Find the workflow by name
                const { data: wfs } = await github.rest.actions.listRepoWorkflows({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                });
                const wf = wfs.workflows.find(w => w.name === wfName);
                if (!wf) { summary[wfName] = { status: 'not_found', runs: 0 }; continue; }

                // Get the latest run
                const { data: runs } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  workflow_id: wf.id,
                  branch: 'main',
                  per_page: 10,
                  created: `>=${since}`,
                });

                const recent = runs.workflow_runs.filter(r => r.status === 'completed');
                const passed = recent.filter(r => r.conclusion === 'success').length;
                const failed = recent.filter(r => r.conclusion === 'failure').length;
                const latest = recent[0];

                summary[wfName] = {
                  total_runs: recent.length,
                  passed,
                  failed,
                  latest_conclusion: latest?.conclusion || 'none',
                  latest_run_url: latest?.html_url || '',
                  pass_rate: recent.length > 0 ? Math.round((passed / recent.length) * 100) : null,
                };
              } catch (e) {
                summary[wfName] = { error: e.message };
              }
            }

            // Write summary to file for next step
            const fs = require('fs');
            fs.writeFileSync('/tmp/pipeline-summary.json', JSON.stringify(summary, null, 2));

            console.log('Pipeline summary:');
            console.log(JSON.stringify(summary, null, 2));

      # ── Aggregate and compute metrics ─────────────────────────────────────
      - name: Aggregate scan metrics
        id: aggregate
        run: |
          f="/tmp/pipeline-summary.json"
          [ ! -f "$f" ] && echo '{}' > "$f"

          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          date_str=$(date -u +"%Y-%m-%d")

          # Parse pass rates per stage
          s1_pass=$(jq -r '."Stage 1 · Secrets Scanning".pass_rate // 0' "$f")
          s2_pass=$(jq -r '."Stage 2 · SAST".pass_rate // 0' "$f")
          s3_pass=$(jq -r '."Stage 3 · SCA (Dependency Scanning)".pass_rate // 0' "$f")
          s4_pass=$(jq -r '."Stage 4 · IaC Security Scanning".pass_rate // 0' "$f")
          s5_pass=$(jq -r '."Stage 5 · Image Build + Cosign Signing".pass_rate // 0' "$f")
          s6_pass=$(jq -r '."Stage 6 · GitOps Deploy (ArgoCD)".pass_rate // 0' "$f")
          s7_pass=$(jq -r '."Stage 7 · Drift Detection".pass_rate // 0' "$f")

          # Overall pass rate (average of all stages)
          total=0; count=0
          for v in $s1_pass $s2_pass $s3_pass $s4_pass $s5_pass $s6_pass $s7_pass; do
            total=$((total + v)); count=$((count + 1))
          done
          overall_pass=$([ "$count" -gt 0 ] && echo "$((total / count))" || echo "0")

          echo "pass_rate=${overall_pass}" >> "$GITHUB_OUTPUT"
          echo "report_path=/tmp/pipeline-summary.json" >> "$GITHUB_OUTPUT"
          echo "total_findings=0" >> "$GITHUB_OUTPUT"   # Extended in future with SARIF parsing

          # ── Publish to CloudWatch ─────────────────────────────────────────
          aws cloudwatch put-metric-data \
            --namespace "${{ env.CW_NAMESPACE }}" \
            --region "${{ env.AWS_REGION }}" \
            --metric-data "[
              {\"MetricName\":\"Stage1SecretScanPassRate\",  \"Timestamp\":\"${timestamp}\",\"Value\":${s1_pass},\"Unit\":\"Percent\"},
              {\"MetricName\":\"Stage2SASTPassRate\",        \"Timestamp\":\"${timestamp}\",\"Value\":${s2_pass},\"Unit\":\"Percent\"},
              {\"MetricName\":\"Stage3SCAPassRate\",         \"Timestamp\":\"${timestamp}\",\"Value\":${s3_pass},\"Unit\":\"Percent\"},
              {\"MetricName\":\"Stage4IaCPassRate\",         \"Timestamp\":\"${timestamp}\",\"Value\":${s4_pass},\"Unit\":\"Percent\"},
              {\"MetricName\":\"Stage5SigningPassRate\",      \"Timestamp\":\"${timestamp}\",\"Value\":${s5_pass},\"Unit\":\"Percent\"},
              {\"MetricName\":\"Stage6DeployPassRate\",      \"Timestamp\":\"${timestamp}\",\"Value\":${s6_pass},\"Unit\":\"Percent\"},
              {\"MetricName\":\"Stage7DriftPassRate\",       \"Timestamp\":\"${timestamp}\",\"Value\":${s7_pass},\"Unit\":\"Percent\"},
              {\"MetricName\":\"PipelinePassRate\",          \"Timestamp\":\"${timestamp}\",\"Value\":${overall_pass},\"Unit\":\"Percent\"},
              {\"MetricName\":\"PipelineRuns\",              \"Timestamp\":\"${timestamp}\",\"Value\":1,\"Unit\":\"Count\"}
            ]" 2>/dev/null || echo "::notice::CloudWatch publish skipped (AWS not configured yet)"

          echo "Metrics published: overall pass rate = ${overall_pass}%"

      # ── Archive aggregated report ─────────────────────────────────────────
      - name: Archive pipeline summary
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-summary-${{ github.run_id }}
          path: /tmp/pipeline-summary.json
          retention-days: 90
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build the comprehensive GitHub Actions Job Summary dashboard
  # This is the always-on, zero-infra fallback (works before cluster exists)
  # ───────────────────────────────────────────────────────────────────────────
  github-summary-dashboard:
    name: "GitHub Actions Summary Dashboard"
    runs-on: ubuntu-latest
    needs: aggregate-and-publish
    if: always()

    steps:
      - name: Fetch pipeline data
        id: data
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const stageMap = {
              'Stage 1 · Secrets Scanning':          { tools: 'Gitleaks + TruffleHog' },
              'Stage 2 · SAST':                      { tools: 'gosec + Semgrep' },
              'Stage 3 · SCA (Dependency Scanning)': { tools: 'govulncheck + Trivy + dotnet' },
              'Stage 4 · IaC Security Scanning':     { tools: 'Checkov + kube-linter + tfsec' },
              'Stage 5 · Image Build + Cosign Signing': { tools: 'Docker Buildx + Cosign + Syft' },
              'Stage 6 · GitOps Deploy (ArgoCD)':    { tools: 'ArgoCD + IRSA' },
              'Stage 7 · Drift Detection':           { tools: 'argocd diff + kubectl' },
            };

            const rows = [];
            for (const [name, meta] of Object.entries(stageMap)) {
              try {
                const { data: wfs } = await github.rest.actions.listRepoWorkflows({
                  owner: context.repo.owner, repo: context.repo.repo,
                });
                const wf = wfs.workflows.find(w => w.name === name);
                if (!wf) {
                  rows.push(`| ${meta.emoji} ${name} | ${meta.tools} | \`not yet run\` | — |`);
                  continue;
                }
                const { data: runs } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner, repo: context.repo.repo,
                  workflow_id: wf.id, branch: 'main', per_page: 1,
                });
                const latest = runs.workflow_runs[0];
                if (!latest) {
                  rows.push(`| ${meta.emoji} ${name} | ${meta.tools} | \`no runs yet\` | — |`);
                  continue;
                }
                const statusBadge = latest.conclusion === 'success' ? '[PASS]' :
                                    latest.conclusion === 'failure' ? '[FAIL]' : '[PENDING]';
                const ago = latest.updated_at
                  ? `${Math.round((Date.now() - new Date(latest.updated_at)) / 60000)}m ago`
                  : '—';
                rows.push(`| ${meta.emoji} ${name} | ${meta.tools} | ${statusEmoji} \`${latest.conclusion || latest.status}\` | [${ago}](${latest.html_url}) |`);
              } catch (e) {
                rows.push(`| ${meta.emoji} ${name} | ${meta.tools} | \`error\` | — |`);
              }
            }

            core.setOutput('table_rows', rows.join('\n'));

      - name: Write Job Summary dashboard
        env:
          TABLE_ROWS: ${{ steps.data.outputs.table_rows }}
          PASS_RATE: ${{ needs.aggregate-and-publish.outputs.pass-rate }}
        run: |
          pass_rate="${PASS_RATE:-N/A}"
          pass_badge="[PASS]"
          [ "${pass_rate}" != "N/A" ] && [ "${pass_rate}" -lt 80 ] && pass_badge="[WARN]"
          [ "${pass_rate}" != "N/A" ] && [ "${pass_rate}" -lt 60 ] && pass_badge="[FAIL]"

          cat >> "$GITHUB_STEP_SUMMARY" << 'SUMMARY_EOF'
          # Security Pipeline Dashboard

          > **Repository**: `Pruthviraj-333/security-cicd-eks-pipeline` | **Branch**: `main`
          > **Generated**: TIMESTAMP_PLACEHOLDER | **Services**: `frontend` · `cartservice` · `checkoutservice`

          SUMMARY_EOF

          # Replace placeholder (heredoc can't expand vars easily)
          sed -i "s/TIMESTAMP_PLACEHOLDER/$(date -u '+%Y-%m-%d %H:%M UTC')/" "$GITHUB_STEP_SUMMARY"

          cat >> "$GITHUB_STEP_SUMMARY" << SUMMARY_EOF

          ## Overall Pipeline Pass Rate: ${pass_rate}% (${pass_badge})

          ## Stage Status

          | Stage | Tools | Status | Last Run |
          |-------|-------|--------|----------|
          ${TABLE_ROWS}

          ---

          ## Architecture

          \`\`\`
          ┌─────────────────────────────────────────────────────────────────────┐
          │                  SECURITY-FIRST CI/CD PIPELINE                      │
          │                                                                     │
          │  PR/Push                                                            │
          │    │                                                                │
          │    ├─ [1] Secrets Scan ─── Gitleaks + TruffleHog (parallel)        │
          │    ├─ [2] SAST ─────────── gosec (Go) + Semgrep (Go+C#)            │
          │    ├─ [3] SCA ──────────── govulncheck + dotnet + Trivy             │
          │    ├─ [4] IaC Scan ─────── Checkov + kube-linter + tfsec           │
          │    │                                                                │
          │  Merge to main                                                      │
          │    │                                                                │
          │    ├─ [5] Image Sign ───── Docker Build → GHCR → Cosign + SBOM     │
          │    ├─ [6] GitOps Deploy ── Manifest update → ArgoCD sync           │
          │    └─ [7] Drift Detect ─── argocd diff + kubectl (every 30m)       │
          │                                                                     │
          │  Grafana Dashboard ──────── CloudWatch + Loki + Prometheus          │
          └─────────────────────────────────────────────────────────────────────┘
          \`\`\`

          ## Security Properties

          | Property | Implementation |
          |----------|----------------|
          | No stored AWS keys | GitHub Actions OIDC → IAM role assumption |
          | No signing keys | Cosign keyless (Sigstore Fulcio + Rekor) |
          | SBOM on every image | Syft SPDX JSON attached as OCI attestation |
          | Least-privilege deploy | Separate IRSA role per workload |
          | Continuous reconciliation | ArgoCD self-heal + 30-min drift checks |
          | Encrypted at rest | KMS for EKS secrets + EBS + CloudWatch logs |
          | Network isolation | Worker nodes in private subnets only |
          | Full audit trail | Sigstore Rekor transparency log |

          ---
          > [View in Grafana](http://localhost:3000) (requires port-forward)
          > [Security tab](https://github.com/${{ github.repository }}/security/code-scanning)
          > [All workflow runs](https://github.com/${{ github.repository }}/actions)

          SUMMARY_EOF

          echo "Job Summary dashboard written"
