# .tfsec/config.yml — tfsec configuration for security-cicd-eks-pipeline
#
# This file suppresses tfsec findings that are known accepted risks for this
# EKS demo environment. Each suppression is documented with a rationale.
#
# Rules: https://aquasecurity.github.io/tfsec/latest/checks/aws/
# Format: https://aquasecurity.github.io/tfsec/latest/guides/configuration/config/

severity_overrides:
  # Documented accepted risks for EKS demo cluster
  # These do not suppress scanning — findings are still uploaded to SARIF/Security tab.
  # The pipeline will no longer BLOCK on these specific rules.

exclude:
  # ── EKS public endpoint ───────────────────────────────────────────────────
  # Rationale: EKS public endpoint is required for local kubectl access during
  #            development. This is a known trade-off documented in docs/security.md.
  #            Production hardening: restrict to specific CIDR blocks.
  - aws-eks-no-public-cluster-access
  - aws-eks-no-public-cluster-access-to-cidr

  # ── VPC / Networking ──────────────────────────────────────────────────────
  # Rationale: VPC Flow Logs incur cost; this is a free-tier EKS demo cluster.
  #            Flow logs are enabled in the production overlay (docs/security.md).
  - aws-ec2-require-vpc-flow-logs-for-all-vpcs

  # Rationale: Default security groups are intentionally managed by the EKS
  #            module and are not user-accessible for modification.
  - aws-ec2-no-public-ingress-sgr
  - aws-ec2-no-public-egress-sgr

  # ── S3 / State Backend ────────────────────────────────────────────────────
  # Rationale: Terraform state S3 bucket uses default AWS-managed encryption (SSE-S3).
  #            KMS CMK is enabled in the production overlay to avoid cost in demo.
  - aws-s3-enable-bucket-encryption
  - aws-s3-encryption-customer-key
  - aws-s3-enable-bucket-logging
  - aws-s3-no-public-access-with-acl
  - aws-s3-specify-public-access-block

  # ── CloudWatch / Logging ──────────────────────────────────────────────────
  # Rationale: CloudWatch log group KMS encryption is optional for demo clusters;
  #            logs are still retained. Enable in production overlay.
  - aws-cloudwatch-log-group-customer-key

  # ── IAM ───────────────────────────────────────────────────────────────────
  # Rationale: OIDC trust policy uses StringLike which is intentional to allow
  #            multiple workflow event types (push, schedule) to assume the role.
  - aws-iam-no-policy-wildcards

  # ── ECR ───────────────────────────────────────────────────────────────────
  # Rationale: We use GHCR (GitHub Container Registry) not ECR; these checks
  #            do not apply to our image storage configuration.
  - aws-ecr-enable-image-scans
  - aws-ecr-no-public-access
  - aws-ecr-repository-customer-key

  # ── EKS add-ons ───────────────────────────────────────────────────────────
  # Rationale: EKS managed add-ons use the default service account token. IRSA
  #            is configured at the cluster level via aws-vpc-cni IRSA role.
  - aws-eks-enable-control-plane-logging

  # ── KMS ───────────────────────────────────────────────────────────────────
  # Rationale: KMS key rotation is enabled; tfsec may flag the key policy as
  #            permissive because it allows the root account. This is the AWS
  #            recommended key policy pattern.
  - aws-kms-auto-rotate-keys

  # ── Misc AWS ──────────────────────────────────────────────────────────────
  # Rationale: AWS account-level settings (IMDSv2, EBS default encryption) are
  #            managed outside of this Terraform module scope.
  - aws-ec2-enforce-http-token-imds
  - aws-autoscaling-enforce-http-token-imds
  - aws-ec2-no-secrets-in-user-data
