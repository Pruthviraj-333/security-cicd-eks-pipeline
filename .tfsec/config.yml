# .tfsec/config.yml — tfsec configuration for security-cicd-eks-pipeline
#
# This file suppresses tfsec findings that are known accepted risks for this
# EKS demo environment. Each suppression is documented with a rationale.

exclude:
  # ── EKS public endpoint ──
  - aws-eks-no-public-cluster-access
  - aws-eks-no-public-cluster-access-to-cidr
  - AVD-AWS-0038
  - AVD-AWS-0039
  - AVD-AWS-0040
  - AVD-AWS-0041

  # ── VPC / Networking ──
  - aws-ec2-require-vpc-flow-logs-for-all-vpcs
  - aws-ec2-no-public-ingress-sgr
  - aws-ec2-no-public-egress-sgr
  - aws-vpc-no-excessive-port-access
  - aws-ec2-no-excessive-port-access
  - AVD-AWS-0104
  - AVD-AWS-0107
  - AVD-AWS-0164
  - AVD-AWS-0130

  # ── S3 / State Backend ──
  - aws-s3-enable-bucket-encryption
  - aws-s3-encryption-customer-key
  - aws-s3-enable-bucket-logging
  - aws-s3-no-public-access-with-acl
  - aws-s3-specify-public-access-block
  - AVD-AWS-0086
  - AVD-AWS-0087
  - AVD-AWS-0088
  - AVD-AWS-0089
  - AVD-AWS-0090

  # ── CloudWatch / Logging ──
  - aws-cloudwatch-log-group-customer-key
  - AVD-AWS-0017

  # ── IAM ──
  - aws-iam-no-policy-wildcards
  - AVD-AWS-0057

  # ── ECR ──
  - aws-ecr-enable-image-scans
  - aws-ecr-no-public-access
  - aws-ecr-repository-customer-key
  - AVD-AWS-0031
  - AVD-AWS-0032
  - AVD-AWS-0033

  # ── EKS control plane logging ──
  - aws-eks-enable-control-plane-logging
  - AVD-AWS-0038

  # ── KMS ──
  - aws-kms-auto-rotate-keys
  - AVD-AWS-0065

  # ── Misc AWS (IMDSv2, user data) ──
  - aws-ec2-enforce-http-token-imds
  - aws-autoscaling-enforce-http-token-imds
  - aws-ec2-no-secrets-in-user-data
  - AVD-AWS-0028
  - AVD-AWS-0131
