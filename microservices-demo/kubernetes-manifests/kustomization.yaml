apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
 - adservice.yaml
 - cartservice.yaml
 - checkoutservice.yaml
 - currencyservice.yaml
 - emailservice.yaml
 - frontend.yaml
# - loadgenerator.yaml # During development, the loadgenerator module inside skaffold.yaml will be used.
 - paymentservice.yaml
 - productcatalogservice.yaml
 - recommendationservice.yaml
 - shippingservice.yaml
images:
  - name: adservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice
    newTag: v0.10.7
  - name: cartservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice
    newTag: v0.10.7
  - name: checkoutservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/checkoutservice
    newTag: v0.10.7
  - name: currencyservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/currencyservice
    newTag: v0.10.7
  - name: emailservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/emailservice
    newTag: v0.10.7
  - name: frontend
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend
    newTag: v0.10.7
  - name: paymentservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice
    newTag: v0.10.7
  - name: productcatalogservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/productcatalogservice
