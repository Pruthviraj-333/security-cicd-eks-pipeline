# gosec configuration for frontend (Google Online Boutique demo service)
# Excludes rules that are known false positives or accepted risks in this demo context.
# See: https://github.com/securego/gosec#available-rules

global:
  # Audit mode: report all issues without noise filters
  audit: false
  nosec: false
  nosec-tag: "#nosec"
  show-ignored: false

rules:
  # G114: Use of net/http serve function that has no support for setting timeouts.
  # Rationale: Demo service uses http.ListenAndServe intentionally; timeouts are
  #            handled at the Kubernetes Ingress / service mesh layer (Istio/Envoy).
  G114:
    severity: low
    confidence: low

  # G304: File path provided as taint input — http.FileServer(http.Dir(path))
  # Rationale: The path is a hardcoded constant ("./static/"), not user input.
  #            This is a false positive for the static file server pattern.
  G304:
    severity: low
    confidence: low

  # G115: Potential integer overflow when converting between integer types
  # Rationale: The int32/int64/uint32 conversions in gRPC protobuf handlers are
  #            bounded by protobuf field limits; overflow is not possible in practice.
  G115:
    severity: low
    confidence: low

  # G402: TLS InsecureSkipVerify set to true
  # Rationale: grpc.WithTransportCredentials(insecure.NewCredentials()) is the
  #            correct pattern for intra-cluster gRPC (service mesh handles mTLS).
  #            This is NOT InsecureSkipVerify on TLS; gosec incorrectly flags it.
  G402:
    severity: low
    confidence: low
